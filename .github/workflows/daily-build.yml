name: Build Node A

on:
  push:
    branches:
      - main
      - chore/chronsync-a-feed-acquisition
      - codex/preserve-xmltv-channel-aliases
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build Node A
        run: |
          set -euo pipefail
          mkdir -p raw_data public

          python scripts/fetch_feeds.py \
            --report raw_data/source_report.tsv \
            --feed "https://i.mjh.nz/PlutoTV/us.xml.gz" "raw_data/pluto_us.xml" \
            --feed "https://i.mjh.nz/PlutoTV/ca.xml.gz" "raw_data/pluto_ca.xml" \
            --feed "https://i.mjh.nz/SamsungTVPlus/us.xml.gz" "raw_data/sam_us.xml" \
            --feed "https://i.mjh.nz/Plex/us.xml.gz" "raw_data/plex_us.xml" \
            --feed "https://i.mjh.nz/Roku/all.xml.gz" "raw_data/roku_all.xml" \
            --feed "https://epgshare01.online/epgshare01/epg_ripper_US2.xml.gz" "raw_data/share_us.xml" \
            --feed "https://epgshare01.online/epgshare01/epg_ripper_US_LOCALS1.xml.gz" "raw_data/share_us_locals.xml" \
            --feed "https://epgshare01.online/epgshare01/epg_ripper_CA2.xml.gz" "raw_data/share_ca.xml"

          # fetch_feeds.py validates each source independently and removes
          # rejected feeds, allowing the remaining usable sources to continue.
          python scripts/build_db.py public/a.sqlite3

      - name: Upload database artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: epg-database
          path: public/*.sqlite3
          if-no-files-found: error

      - name: Upload per-source reports
        uses: actions/upload-artifact@v4
        with:
          name: epg-reports
          path: |
            raw_data/source_report.tsv
            raw_data/build_report.tsv
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
