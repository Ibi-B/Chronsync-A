name: Build Node A

on:
  push:
    branches:
      - codex/validate-epg-build-2026-11-10
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build Node A
        run: |
          mkdir -p raw_data public
          curl -L --fail "https://i.mjh.nz/PlutoTV/us.xml.gz" | gunzip > raw_data/pluto_us.xml
          curl -L --fail "https://i.mjh.nz/PlutoTV/ca.xml.gz" | gunzip > raw_data/pluto_ca.xml
          curl -L --fail "https://i.mjh.nz/SamsungTVPlus/us.xml.gz" | gunzip > raw_data/sam_us.xml
          curl -L --fail "https://i.mjh.nz/Plex/us.xml.gz" | gunzip > raw_data/plex_us.xml
          curl -L --fail "https://i.mjh.nz/Roku/all.xml.gz" | gunzip > raw_data/roku_all.xml
          curl -L --fail "https://epgshare01.online/epgshare01/epg_ripper_US2.xml.gz" | gunzip > raw_data/share_us.xml
          curl -L --fail "https://epgshare01.online/epgshare01/epg_ripper_US_LOCALS1.xml.gz" | gunzip > raw_data/share_us_locals.xml
          curl -L --fail "https://epgshare01.online/epgshare01/epg_ripper_CA2.xml.gz" | gunzip > raw_data/share_ca.xml
          python scripts/build_db.py public/a.sqlite3
          python scripts/validate_db.py public/a.sqlite3

      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
